# Déploiement Render : « New + » → « Blueprint » → choisir le dépôt GitHub.
# Base de données : créez un cluster gratuit MongoDB Atlas et collez son URI dans MONGO_URI.
services:
  - type: web
    name: boutik-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false            # URI MongoDB Atlas
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false            # URL du frontend, ex. https://boutik.onrender.com
      - key: UPLOADS_DIR
        value: /data/uploads
    disk:                      # nécessite une offre payante ; sans disque, les images envoyées sont perdues à chaque redéploiement
      name: uploads
      mountPath: /data
      sizeGB: 1

  - type: web
    name: boutik-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false            # URL de l'API, ex. https://boutik-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
